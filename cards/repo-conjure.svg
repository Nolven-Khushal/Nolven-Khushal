<svg xmlns="http://www.w3.org/2000/svg" width="432" height="168" viewBox="0 0 432 168" role="img" aria-label="Conjure: Control the whole PC with your hands, and pull 26,000-dot holograms apart with your fingers."><style>
@font-face{font-family:'Clash';src:url(data:font/woff;base64,) format('woff');font-weight:600}
.clash{font-family:'Clash',-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:600}
.sans{font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.in{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tile{transform-origin:50% 100%;opacity:0;animation:swing 1s cubic-bezier(.2,.9,.3,1.15) forwards;transform-box:fill-box}
@keyframes swing{0%{opacity:0;transform:translateY(36px) rotate(-3deg)}55%{opacity:1;transform:translateY(-5px) rotate(1deg)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .in,.row,.sq,.bar,.tile{opacity:1!important;transform:none!important}}

</style><rect width="432" height="168" rx="22" fill="#06060A"/><rect x=".5" y=".5" width="431" height="167" rx="21.5" fill="none" stroke="#EEEAE0" stroke-opacity=".1"/><defs><clipPath id="c"><rect width="432" height="168" rx="22"/></clipPath></defs><g class="tile" style="animation-delay:0.2s"><g clip-path="url(#c)"><rect width="432" height="168" fill="#0D0D14"/><rect width="5" height="168" fill="#3DFF8F"/></g>
<text class="clash" x="28" y="46" font-size="26" fill="#EEEAE0">Conjure</text><text class="mono" x="404" y="44" font-size="11" letter-spacing="1.8" fill="#3DFF8F" text-anchor="end">WINDOWS APP</text><text class="sans" x="28" y="74" font-size="14" fill="#EEEAE0" fill-opacity=".8">Control the whole PC with your hands, and pull</text><text class="sans" x="28" y="94" font-size="14" fill="#EEEAE0" fill-opacity=".8">26,000-dot holograms apart with your fingers.</text><rect x="28" y="116" width="127" height="26" rx="13" fill="#EEEAE0" fill-opacity=".06"/><text class="sans" x="91.5" y="133" font-size="12" fill="#EEEAE0" fill-opacity=".72" text-anchor="middle">Computer vision</text><rect x="163" y="116" width="50" height="26" rx="13" fill="#EEEAE0" fill-opacity=".06"/><text class="sans" x="188.0" y="133" font-size="12" fill="#EEEAE0" fill-opacity=".72" text-anchor="middle">Rust</text><rect x="221" y="116" width="78" height="26" rx="13" fill="#EEEAE0" fill-opacity=".06"/><text class="sans" x="260.0" y="133" font-size="12" fill="#EEEAE0" fill-opacity=".72" text-anchor="middle">Three.js</text></g></svg>