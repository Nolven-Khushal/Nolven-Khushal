name: Refresh profile heatmap

on:
  schedule:
    - cron: "17 3 * * *" # daily, 08:47 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render heatmap
        run: python build_profile_art.py heatmap "${{ github.repository_owner }}"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution heatmap"
          file_pattern: assets/contrib-heatmap.svg
