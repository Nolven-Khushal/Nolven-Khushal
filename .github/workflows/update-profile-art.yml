name: Refresh profile cards

on:
  schedule:
    - cron: "17 3 * * *" # daily, 08:47 IST
  push:
    paths: ["scripts/**", "fonts/**", "data/portrait.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render the cards (hero, tiles, activity, graph, repo cards)
        run: python scripts/render_cards.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile cards"
          file_pattern: "cards/*.svg data/contributions.json"
